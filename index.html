<html lang="en"><head><meta charset="utf-8">

<style>@font-face{font-family:'Lilita One';font-weight:400;src:url(fonts/lilita-one-latin-400-normal.woff2) format('woff2')}@font-face{font-family:Nunito;font-weight:800;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}@font-face{font-family:Nunito;font-weight:900;src:url(fonts/nunito-latin-900-normal.woff2) format('woff2')}</style>
<style>
/* Layout: full-screen 3D chase view; progress bar and pause pinned to the top edge like a casual mobile game; big glossy buttons over the scene on the menu; blue boards for the other screens */
:root{
  --navy:#10265f; --blue:#2f7bff; --blue2:#1f55d6; --sky:#bfe3ff; --yellow:#ffd21f; --yellow2:#f0a800;
  --green:#34d96b; --green2:#16a84a; --white:#ffffff; --ink:#10265f; --muted:#5a6b9a;
  --display:"Lilita One","Trebuchet MS",sans-serif; --body:"Nunito",system-ui,sans-serif;
  --outline:0 3px 0 var(--navy),0 -3px 0 var(--navy),3px 0 0 var(--navy),-3px 0 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),2px -2px 0 var(--navy),-2px -2px 0 var(--navy),0 6px 0 var(--navy);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--sky);color:var(--ink);font:900 16px/1.35 var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--sky);touch-action:none}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* HUD */
#hud{position:fixed;z-index:5;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:start;pointer-events:none}
#pause{pointer-events:auto;width:50px;height:50px;border-radius:50%;padding:0;border:3px solid #fff;
  background:radial-gradient(circle at 35% 28%,#9aa4b8,#586177);box-shadow:0 5px 0 #353d50,0 0 0 2px rgba(16,38,95,.35);position:relative}
#pause::before,#pause::after{content:"";position:absolute;top:14px;width:6px;height:16px;border-radius:2px;background:#fff}
#pause::before{left:14px}#pause::after{right:14px}
#pause:active{transform:translateY(3px);box-shadow:0 2px 0 #353d50}
.prog{position:relative;padding-top:20px;min-width:0;--p:0}
.bar{margin:0 26px;height:22px;border-radius:12px;background:#a9b9ff;border:3px solid #fff;overflow:hidden;
  box-shadow:0 0 0 3px rgba(16,38,95,.4),inset 0 4px 0 rgba(16,38,95,.18)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#ffe978,#ffb81f)}
.flag{position:absolute;right:0;top:14px;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--navy);display:grid;place-items:center}
.flag::before{content:"";width:12px;height:12px;background:conic-gradient(var(--navy) 25%,#fff 0 50%,var(--navy) 0 75%,#fff 0);border-radius:2px}
.shield{position:absolute;top:0;left:calc(26px + (100% - 52px) * var(--p));width:56px;height:64px;transform:translateX(-50%);
  background:var(--navy);clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.shield::before{content:"";position:absolute;inset:4px;background:linear-gradient(#4f9bff,#1f55d6);clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%)}
.shield small{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:9px;letter-spacing:1.5px;color:#cfe3ff}
.shield b{position:absolute;left:0;right:0;top:15px;text-align:center;font-family:var(--display);font-weight:400;font-size:26px;line-height:1;color:#fff;text-shadow:0 2px 0 var(--navy)}
.score{grid-column:1/-1;justify-self:center;display:flex;align-items:center;gap:8px;margin-top:8px}
.score b{font-family:var(--display);font-weight:400;font-size:38px;line-height:1;color:#fff;text-shadow:var(--outline);font-variant-numeric:tabular-nums}
.score small{font-family:var(--display);font-size:17px;color:var(--yellow);text-shadow:0 2px 0 var(--navy),0 -2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy);font-variant-numeric:tabular-nums}
.spd{grid-column:1/-1;justify-self:center;margin-top:2px;font-family:var(--display);font-size:15px;color:#fff;text-shadow:0 2px 0 var(--navy),0 -2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy);min-height:18px}
.coin{display:inline-block;width:30px;height:30px;border-radius:50%;flex:none;border:3px solid var(--navy);
  background:radial-gradient(circle at 35% 30%,#fff1a0,var(--yellow) 50%,var(--yellow2));position:relative}
.coin::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(240,168,0,.75)}
.coin.sm{width:22px;height:22px;border-width:2px;vertical-align:-5px}
.coin.sm::after{inset:4px;border-width:2px}

#start{position:fixed;z-index:5;left:50%;top:54%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:14px;pointer-events:none;white-space:nowrap}
#start b{font-family:var(--display);font-weight:400;font-size:clamp(26px,8vw,40px);color:#fff;text-shadow:var(--outline)}
#start i{width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;filter:drop-shadow(0 3px 0 var(--navy));animation:nudge 1s ease-in-out infinite}
#start i:first-child{border-right:20px solid #fff}
#start i:last-child{border-left:20px solid #fff;animation-delay:.5s}
@keyframes nudge{50%{transform:translateX(6px)}}
#start i:first-child{animation-name:nudgel}
@keyframes nudgel{50%{transform:translateX(-6px)}}
#stick{position:fixed;z-index:4;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:rgba(255,255,255,.22);pointer-events:none}
#stick i{display:none}
#toast{position:fixed;z-index:6;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);transform:translateX(-50%);max-width:calc(100% - 32px);
  background:var(--navy);color:#fff;border-radius:14px;padding:8px 16px;font-size:15px;text-align:center;pointer-events:none;transition:opacity .4s}
#toast.off{opacity:0}
#pops{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:36px;color:#fff;text-shadow:var(--outline);animation:pop .8s ease-out forwards}
@keyframes pop{0%{opacity:1;margin-top:0;scale:.7}20%{scale:1.15}100%{opacity:0;margin-top:-90px;scale:1}}
#fade{position:fixed;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#fade.on{opacity:.9}

/* Screens */
#ui{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.panel{pointer-events:auto;width:100%;max-width:440px;max-height:100%;overflow:auto;color:#fff;
  background:linear-gradient(#4f9bff,#2764ec);border:4px solid var(--navy);border-radius:28px;
  box-shadow:0 8px 0 var(--navy),inset 0 4px 0 rgba(255,255,255,.35);padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.panel h2{font-size:34px;line-height:1.05;text-shadow:var(--outline)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 130px;min-width:0;color:#fff;border:4px solid var(--navy);border-radius:18px;padding:10px 14px;
  background:linear-gradient(#63f293,#1fbf55);box-shadow:0 6px 0 var(--navy),inset 0 4px 0 rgba(255,255,255,.45);
  font-family:var(--display);font-size:24px;letter-spacing:.5px;text-align:center;text-shadow:0 3px 0 rgba(16,38,95,.55)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy),inset 0 4px 0 rgba(255,255,255,.45)}
.btn.blue{background:linear-gradient(#6fb0ff,#2f6df0)}
.btn.alt{background:linear-gradient(#fff,#d9e4ff);color:var(--navy);text-shadow:none}
.btn.red{background:linear-gradient(#ff8aa8,#ee3b6c)}
.btn.sm{font-size:18px;padding:6px 10px;border-radius:14px;box-shadow:0 4px 0 var(--navy),inset 0 3px 0 rgba(255,255,255,.45);flex:none;width:100%}
.btn.back{flex:none;width:auto;padding:6px 16px;font-size:18px;box-shadow:0 4px 0 var(--navy)}
.btn[disabled]{background:linear-gradient(#cfd5e6,#a9b1c8);color:#fff;box-shadow:0 2px 0 var(--navy);transform:translateY(3px);cursor:default}
.bank{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--navy);border-radius:999px;padding:3px 16px 3px 6px;font-family:var(--display);font-size:24px;color:#fff;font-variant-numeric:tabular-nums}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}

.menu{pointer-events:none;position:absolute;display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  inset:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(16px,env(safe-area-inset-left,0px))}
.logo{display:flex;flex-direction:column;align-items:center;transform:rotate(-3deg);font-family:var(--display);line-height:.95;color:#fff;text-shadow:var(--outline);font-size:clamp(54px,19vw,92px);letter-spacing:1px}
.logo span:last-child{color:var(--yellow)}
.menubot{pointer-events:auto;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:14px}
.btn.play{width:100%;flex:none;font-size:40px;padding:12px 16px}
.menubot .row{width:100%}
.help{margin:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 2px 0 var(--navy),0 -1px 0 var(--navy),1px 0 0 var(--navy),-1px 0 0 var(--navy)}
.pill{pointer-events:auto;position:absolute;right:0;top:34%;width:68px;display:flex;flex-direction:column;gap:8px;padding:9px;border-radius:34px;background:rgba(70,76,92,.88);border:3px solid #fff;box-shadow:0 5px 0 rgba(16,38,95,.4)}
.pill button{padding:0;border:3px solid transparent;border-radius:50%;background:none;line-height:0}
.pill button.on{border-color:var(--yellow)}
.pill canvas{width:100%;height:auto;display:block}

#lvlist{display:grid;gap:10px}
.lv{display:flex;align-items:center;gap:12px;text-align:left;color:var(--navy);background:#fff;border:3px solid var(--navy);border-radius:18px;box-shadow:0 5px 0 var(--navy);padding:8px 12px;width:100%}
.lv:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.lv .n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;border:3px solid var(--navy);display:grid;place-items:center;font-family:var(--display);font-size:24px}
.lv .t{min-width:0;flex:1}
.lv .t b{display:block;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1}
.lv .t span{font-size:13px;color:var(--muted)}
.lv[disabled]{opacity:.6;cursor:default;box-shadow:0 2px 0 var(--navy);transform:translateY(3px)}
.lv[disabled] .n{background:#8a96b8}

#shgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sk{background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sk.on{box-shadow:0 0 0 4px var(--green)}
.sk canvas{width:84px;height:84px}
.sk b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1}
.stats{display:flex;flex-direction:column;gap:6px;background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:16px;padding:12px 14px}
.stats div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){#toast,#fade{transition:none}#start i{animation:none}.pop{animation-duration:.01s}}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 50%,var(--vig,rgba(0,0,0,.25)) 100%)}
#flash{position:fixed;inset:0;z-index:3;pointer-events:none;background:#e4ecff;opacity:0}

#card{position:fixed;inset:0;z-index:9;background:#10265f;overflow:hidden;cursor:pointer;touch-action:none}
#card[hidden]{display:none}
#card-cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 3.6s cubic-bezier(.2,.7,.2,1),opacity .4s}
#card.in #card-cv{transform:scale(1)}
#card.out{opacity:0;transition:opacity .4s}
.cctx{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 7%);text-align:center;padding:0 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
#card-n{font-family:var(--display);letter-spacing:.14em;font-size:19px;background:var(--yellow);color:var(--navy);padding:6px 18px 4px;border-radius:999px;border:3px solid var(--navy);box-shadow:0 4px 0 var(--navy);transform:translateY(-30px) scale(.6);opacity:0}
#card-t{font-family:var(--display);font-weight:400;font-size:clamp(40px,13.5vw,70px);line-height:1;color:#fff;-webkit-text-stroke:9px var(--navy);paint-order:stroke fill;text-shadow:0 7px 0 rgba(8,16,48,.55);transform:translateY(40px) scale(.7);opacity:0}
#card-b{margin:0;max-width:330px;font-weight:900;font-size:16px;line-height:1.25;color:#fff;text-shadow:0 2px 0 var(--navy),0 -2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy),0 3px 8px rgba(0,0,0,.4);opacity:0;transform:translateY(20px)}
#card.in #card-n{animation:cpop .5s .15s cubic-bezier(.2,1.5,.4,1) forwards}
#card.in #card-t{animation:cpop .6s .3s cubic-bezier(.2,1.4,.4,1) forwards}
#card.in #card-b{animation:cup .5s .7s ease-out forwards}
.ctap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;font-family:var(--display);font-size:17px;letter-spacing:.12em;color:#fff;text-shadow:0 2px 0 var(--navy),0 -2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy);opacity:0;animation:cblink 1.2s 1.4s infinite}
#card.bonus #card-n{background:#ffd21f;color:#7a3dff}
#card.bonus #card-t{-webkit-text-stroke-color:#5a1fb8}
@keyframes cpop{to{opacity:1;transform:none}}
@keyframes cup{to{opacity:1;transform:none}}
@keyframes cblink{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#card-cv{transition:none;transform:none}#card.in #card-n,#card.in #card-t,#card.in #card-b{animation-duration:.01s}}
.row.tgl .btn{flex:1;font-size:16px;padding:10px 8px}

.starsum{font-family:var(--display);color:#fff;text-shadow:var(--outline);font-size:22px;text-align:center;padding:2px 0 6px}
.starsum b{font-weight:400;color:var(--yellow)}.starsum span{display:block;font-family:inherit;font-size:14px;opacity:.95}
.lv .stars{flex:none;font-style:normal;font-size:19px;letter-spacing:1px;color:#ffb300;text-shadow:0 1px 0 var(--navy);white-space:nowrap}
.sk .perk{font-size:11.5px;line-height:1.2;color:var(--muted);min-height:28px;display:block}
.rstars{display:flex;justify-content:center;gap:8px;padding:2px 0 6px}
.rstars i{font-style:normal;font-size:50px;line-height:1;color:#b9c3dc;text-shadow:0 3px 0 var(--navy);-webkit-text-stroke:2px var(--navy)}
.rstars i.on{color:#ffc21a;animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both;animation-delay:var(--d)}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.goal.ok span:first-child{color:#17a34a}.goal.no span:first-child{color:#8a96b8}
.unl{text-align:center;font-family:var(--display);color:#ff3d8e;font-size:17px;padding:6px 0 2px}
.pwbar{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 118px);display:flex;flex-direction:column;gap:12px;pointer-events:none}
.pwc{position:relative;width:46px;height:46px}.pwc img{width:46px;height:46px;display:block;filter:drop-shadow(0 2px 0 rgba(16,38,95,.6))}
.pwc i{position:absolute;left:0;bottom:-7px;height:6px;border-radius:4px;background:var(--c);border:2px solid var(--navy);box-sizing:content-box;max-width:42px}
.pwc.heart{display:grid;place-items:center;font-size:34px;color:#ff3d6e;text-shadow:0 2px 0 var(--navy),0 -2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy)}
#slowfx{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(ellipse at 50% 50%,rgba(120,100,255,0) 38%,rgba(120,100,255,.38) 100%);mix-blend-mode:screen}

#lvlist{display:block}
.lmap{position:relative;border-radius:22px;border:3px solid var(--navy);overflow:hidden;margin-top:6px;
  background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.18) 0 18%,transparent 19%),linear-gradient(#37c4ff,#1a7de8 40%,#1456c8)}
.lmap::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.07) 0 3px,transparent 3px 46px);opacity:.8}
.lmap svg{position:absolute;inset:0;width:100%;height:100%}
.lmap path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round}
.lmap .p0{stroke:rgba(255,255,255,.4);stroke-width:5;stroke-dasharray:2 11}
.lmap .p1{stroke:#ffe14d;stroke-width:6;stroke-dasharray:2 11}
.deco{position:absolute;font-style:normal;font-size:24px;opacity:.7;transform:translate(-50%,-50%)}
.isl{position:absolute;transform:translate(-50%,-50%);width:112px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:#fff}
.isl .ld{position:relative;width:70px;height:62px;border-radius:52% 48% 55% 45%/58% 52% 48% 42%;border:3px solid var(--navy);display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 30%,var(--g) 0 55%,var(--t) 56% 100%);box-shadow:0 6px 0 var(--navy),0 12px 8px rgba(0,30,90,.35)}
.isl:active .ld{transform:translateY(3px)}
.isl .em{font-size:30px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.isl .nn{position:absolute;left:50%;top:-4px;margin-left:-47px;min-width:26px;height:26px;border-radius:13px;background:var(--blue);border:3px solid var(--navy);display:grid;place-items:center;font-family:var(--display);font-size:15px;color:#fff;padding:0 3px;box-sizing:border-box}
.isl .tw{position:absolute;right:-8px;bottom:-6px;font-size:18px}
.isl .sec{position:absolute;right:-4px;top:-6px;font-size:18px;color:#ffd21f;text-shadow:0 0 0 #fff,0 2px 0 var(--navy)}
.isl .lb{display:flex;flex-direction:column;align-items:center;line-height:1.05;margin-top:2px}
.isl .lb b{font-family:var(--display);font-weight:400;font-size:13px;color:#fff;text-shadow:var(--outline);max-width:112px;text-align:center}
.isl .lb em{font-style:normal;font-size:14px;color:#ffc21a;letter-spacing:1px;text-shadow:0 1px 0 var(--navy);min-height:16px}
.isl.lock .ld{filter:grayscale(.85) brightness(.8)}.isl.lock .lb b{opacity:.6}.isl.lock .nn{background:#8a96b8}
.isl.cur .ld{animation:curp 1.4s ease-in-out infinite}
@keyframes curp{0%,100%{box-shadow:0 6px 0 var(--navy),0 0 0 0 rgba(255,225,77,.9)}50%{box-shadow:0 6px 0 var(--navy),0 0 0 12px rgba(255,225,77,0)}}
#s-levels{width:min(440px,100%)}.lmap{width:100%;min-width:300px}
.lmap{background:#1c88e0}.lmap::before{display:none}
.mapbg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lmap svg{z-index:1}.lmap .p0{display:none}.lmap .p1{stroke:#fff6b0;stroke-width:5;stroke-dasharray:1 10}

/* tidy coins: none inside obstacles, off the track or over empty gaps, then keep every second one */
function strategicCoins(lv,n){

  };

    }
  }

    if(!rows[r].length||(r+1<N&&rows[r+1].length))continue;

  }

/* ---------- themed spinners ---------- */
function themedSpin(sp,pal){
  const sk=skOf(pal),c=sk.spin,g=new THREE.Group();
  const postM=sk.spin.glow?phM('#1a1a3a'):phM(pal.skirt||'#39406a'),post=cyl(.38,.5,1.4,14,postM,0,.7,0);g.add(post);g.add(cyl(.5,.5,.12,14,gM(c.tc),0,1.38,0));
  const armM=c.stripe?stripeLam([c.arm,c.stripe],6,1):c.glow?gM(c.arm):phM(c.arm,{shininess:30}),tcM=c.glow?gM(c.tc):phM(c.tc,{shininess:50});
  for(let k=0;k<sp.arms;k++){
    const h=new THREE.Group(),L=sp.len;
    h.add(mkBox(L,c.glow?.6:.8,c.glow?.3:.4,armM,L/2,.4,0));
    switch(c.tip){
      case'ball':h.add(ball_(.36,tcM,L,.4,0,12));break;
      case'glow':h.add(ball_(.36,tcM,L,.4,0,12),ball_(.55,gM(c.tc,.28),L,.4,0,12));break;
      case'mace':{h.add(ball_(.38,tcM,L,.4,0,10));for(const dr of[[0,1,0],[0,-1,0],[1,0,0],[0,0,1],[0,0,-1]])h.add(spikeAt(tcM,L+dr[0]*.3,.4+dr[1]*.3,dr[2]*.3,new THREE.Vector3(dr[0],dr[1],dr[2]),.1,.3,6));break}
      case'scythe':{const bl=cone(.34,1.1,4,tcM,L-.2,.4,.35);bl.rotation.z=Math.PI/2;bl.scale.z=.25;h.add(bl);break}
      case'saw':{const s=cyl(.5,.5,.1,14,tcM,L,.4,0);h.add(s);for(let i=0;i<8;i++){const t=cone(.09,.18,3,tcM,L+Math.cos(i*.785)*.55,.4,Math.sin(i*.785)*.55);t.rotation.set(Math.PI/2,0,0);h.add(t)}break}
      case'anchor':{const t=new THREE.Mesh(tgeo(new THREE.TorusGeometry(.3,.07,6,12,Math.PI)),tcM);t.position.set(L,.45,0);t.rotation.z=Math.PI;h.add(t,mkBox(.1,.4,.1,tcM,L,.7,0));break}
      case'puffer':{h.add(ball_(.4,tcM,L,.4,0,10));for(let i=0;i<8;i++){const a=i*.785,dr=new THREE.Vector3(Math.cos(a),Math.sin(a*1.3)*.6,Math.sin(a*1.7));h.add(spikeAt(phM('#8a4a10'),L+dr.x*.36,.4+dr.y*.36,dr.z*.36,dr,.07,.25,5))}break}
      case'cloud':for(const [x,z,r] of[[0,0,.34],[.22,.1,.26],[-.2,-.1,.26]])h.add(ball_(r,tcM,L+x,.4,z,10));break;
      case'spike':for(let i=-1;i<=1;i++){const s=cone(.14,.4,5,tcM,L+.1,.4+i*.05,i*.18);s.rotation.z=-Math.PI/2;h.add(s)}break;
    }
    h.rotation.y=-k*Math.PI*2/sp.arms;g.add(h);
  }
  return g;
}

/* ---------- ground check: nothing may hang in the air ---------- */
function groundFix(){
  let fixed=0,removed=0;
  const sup=(s,u,y)=>{const f=surfaceAt(s,u,(y==null?frameY(s):y)+BR+.35);return !!f};
  const sup5=(s,u,hw,hd)=>sup(s,u)&&sup(s,u-hw)&&sup(s,u+hw)&&sup(s-hd,u)&&sup(s+hd,u);
  for(const b of R.bombs){
    if(b.rain||b.dead)continue;
    if(!sup(b.s,b.u)){b.dead=true;world.remove(b.m);removed++;continue}
    let n=0;while(!sup5(b.s,b.u,.38,.38)&&n++<8){b.u-=Math.sign(b.u)*.15;fixed++}
    if(!sup5(b.s,b.u,.38,.38)){b.dead=true;world.remove(b.m);removed++}
  }
  R.bombs=R.bombs.filter(b=>!b.dead);
  for(const o of R.blocks.slice()){
    const hw=o.w/2*.92,hd=o.d/2*.92;
    const okAt=cu=>sup5(o.s,cu,hw,hd);
    if(!o.amp){let n=0;while(!okAt(o.u)&&n++<8){o.u-=Math.sign(o.u||1)*.15;o.cu=o.u;fixed++}if(!okAt(o.u)){world.remove(o.m);R.blocks.splice(R.blocks.indexOf(o),1);removed++}continue}
    let n=0;while(n++<14&&!(okAt(o.u-o.amp)&&okAt(o.u+o.amp)&&okAt(o.u))){o.amp=Math.max(0,o.amp-.1);fixed++;if(o.amp<=0)break}
    if(!okAt(o.u)){world.remove(o.m);R.blocks.splice(R.blocks.indexOf(o),1);removed++}
  }
  for(const w of R.spins.slice()){
    if(!sup(w.s,w.u)||!sup(w.s,w.u-.5)||!sup(w.s,w.u+.5)){let n=0;while(n++<6&&!(sup(w.s,w.u)&&sup(w.s,w.u-.5)&&sup(w.s,w.u+.5))){w.u-=Math.sign(w.u||1)*.15;fixed++}if(!(sup(w.s,w.u)&&sup(w.s,w.u-.5)&&sup(w.s,w.u+.5))){world.remove(w.m);R.spins.splice(R.spins.indexOf(w),1);removed++}}
  }
  R.fixInfo={fixed,removed};
}

  }

    const k=j*(nx+1)+i,wx=x0+i*cell,wz=z0+j*cell;

  let cx=0,cz=0;for(const p of pts){cx+=p[0];cz+=p[2]}cx/=pts.length;cz/=pts.length;
  for(let j=0;j<=nz;j++)for(let i=0;i<=nx;i++){

  planks:(g,w,h,pal,r)=>{for(let y=0;y<8;y++){g.fillStyle='rgba('+(y%2?'255,255,255':'0,0,0')+',.07)';g.fillRect(0,y*32,w,32);g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=3;g.beginPath();g.moveTo(0,y*32);g.lineTo(w,y*32);g.stroke();const x=r()*w;g.beginPath();g.moveTo(x,y*32);g.lineTo(x,y*32+32);g.stroke();g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x+6,y*32+6,3,3);g.fillRect(x+6,y*32+23,3,3)}g.strokeStyle='rgba(0,0,0,.12)';g.lineWidth=1;for(let i=0;i<40;i++){const x=r()*w,y=r()*h;g.beginPath();g.moveTo(x,y);g.lineTo(x+20+r()*40,y+r()*2);g.stroke()}},
  stone:(g,w,h,pal,r)=>{for(let y=0;y<8;y++){const off=y%2?16:0;for(let x=-1;x<8;x++){g.fillStyle='rgba('+(r()<.5?'255,255,255':'0,0,40')+','+(.05+r()*.1)+')';g.fillRect(x*32+off+1,y*32+1,30,30)}}g.strokeStyle='rgba(20,20,40,.5)';g.lineWidth=3;for(let y=0;y<=8;y++){g.beginPath();g.moveTo(0,y*32);g.lineTo(w,y*32);g.stroke()}for(let y=0;y<8;y++){const off=y%2?16:0;for(let x=-1;x<9;x++){g.beginPath();g.moveTo(x*32+off,y*32);g.lineTo(x*32+off,y*32+32);g.stroke()}}},
  tiles:(g,w,h,pal,r)=>{for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.fillStyle='rgba('+((x+y)%2?'255,255,255':'0,0,0')+',.09)';g.fillRect(x*64,y*64,64,64)}g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=3;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke();g.beginPath();g.moveTo(0,i*64);g.lineTo(w,i*64);g.stroke()}},
  checker:(g,w,h,pal,r)=>{for(let y=0;y<8;y++)for(let x=0;x<8;x++){g.fillStyle=(x+y)%2?'rgba(255,255,255,.35)':'rgba(180,30,30,.30)';g.fillRect(x*32,y*32,32,32)}},
  dots:(g,w,h,pal,r)=>{for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.fillStyle='rgba(255,255,255,.28)';g.beginPath();g.arc(x*64+32,y*64+32,18,0,7);g.fill();g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.arc(x*64+34,y*64+35,18,0,7);g.fill();g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.arc(x*64+31,y*64+30,14,0,7);g.fill()}},
  mud:(g,w,h,pal,r)=>{for(let i=0;i<90;i++){g.fillStyle='rgba('+(r()<.5?'255,255,255':'0,0,0')+','+(.04+r()*.1)+')';g.beginPath();g.arc(r()*w,r()*h,6+r()*22,0,7);g.fill()}g.fillStyle='rgba(0,0,0,.25)';for(const [x,y] of[[40,60],[170,150],[90,220]]){g.beginPath();g.ellipse(x,y,14,8,.3,0,7);g.fill()}},
  metal:(g,w,h,pal,r)=>{for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=3;g.strokeRect(x*64+2,y*64+2,60,60);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(x*64+4,y*64+4,56,56);g.fillStyle='rgba(0,0,0,.5)';for(const [a,b] of[[8,8],[56,8],[8,56],[56,56]]){g.beginPath();g.arc(x*64+a,y*64+b,3,0,7);g.fill()}}},
  sand:(g,w,h,pal,r)=>{for(let i=0;i<500;i++){g.fillStyle='rgba('+(r()<.5?'255,250,220':'120,80,30')+','+(.05+r()*.12)+')';g.fillRect(r()*w,r()*h,2,2)}g.strokeStyle='rgba(120,80,30,.2)';g.lineWidth=2;for(let i=0;i<8;i++){const y=r()*h;g.beginPath();g.moveTo(0,y);g.quadraticCurveTo(w/2,y+8*(r()-.5),w,y);g.stroke()}},
  snow:(g,w,h,pal,r)=>{for(let i=0;i<300;i++){g.fillStyle='rgba(255,255,255,'+(.1+r()*.4)+')';g.fillRect(r()*w,r()*h,2+r()*2,2+r()*2)}g.fillStyle='rgba(120,160,220,.15)';for(let i=0;i<10;i++){g.beginPath();g.ellipse(r()*w,r()*h,20+r()*20,6,0,0,7);g.fill()}},
  rainbow:(g,w,h,pal,r)=>{const cs=['#ff3d4e','#ff9a1a','#ffe14d','#35d96b','#2f9bff','#9b5cff'];cs.forEach((c,i)=>{g.fillStyle=c;g.globalAlpha=.55;g.fillRect(i*w/6,0,w/6,h)});g.globalAlpha=1;g.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<70;i++)g.fillRect(r()*w,r()*h,3,3)},
  hex:(g,w,h,pal,r)=>{g.strokeStyle='rgba(122,255,200,.55)';g.lineWidth=3;for(let y=0;y<5;y++)for(let x=0;x<5;x++){const cx=x*56+(y%2?28:0),cy=y*50;g.beginPath();for(let k=0;k<6;k++){const a=k/6*6.28;g.lineTo(cx+Math.cos(a)*26,cy+Math.sin(a)*26)}g.closePath();g.stroke()}g.fillStyle='rgba(122,255,200,.5)';for(let i=0;i<12;i++){g.beginPath();g.arc(r()*w,r()*h,3,0,7);g.fill()}},
  moss:(g,w,h,pal,r)=>{for(let i=0;i<120;i++){g.fillStyle='rgba('+(r()<.5?'120,200,80':'30,60,20')+','+(.06+r()*.12)+')';g.beginPath();g.arc(r()*w,r()*h,4+r()*14,0,7);g.fill()}g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=3;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke()}},
  marble:(g,w,h,pal,r)=>{g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=3;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke();g.beginPath();g.moveTo(0,i*64);g.lineTo(w,i*64);g.stroke()}g.strokeStyle='rgba(120,130,160,.35)';g.lineWidth=2;for(let i=0;i<14;i++){let x=r()*w,y=r()*h;g.beginPath();g.moveTo(x,y);for(let k=0;k<4;k++){x+=r()*40-20;y+=r()*24;g.lineTo(x,y)}g.stroke()}g.fillStyle='rgba(255,210,70,.35)';for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.fillRect(x*64+4,y*64+4,6,6)}}
};
function trackKit(kind){return pal=>ctex(256,256,(g,w,h)=>{g.fillStyle=pal.track;g.fillRect(0,0,w,h);const r=lcg(5);TEXK[kind](g,w,h,pal,r);chev(g,.34)},true)}

/* ---------- sky helpers ---------- */
const SKYX={
  clouds:(g,w,h,r,s)=>clouds(g,w,h,r,s[1],s[2]),
  stars:(g,w,h,r,s)=>starsSky(g,w,h,r,s[1]),
  aurora:(g,w,h,r,s)=>{s[1].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.moveTo(0,h*(.12+i*.07));for(let x=0;x<=w;x+=12)g.lineTo(x,h*(.12+i*.07)+Math.sin(x/34+i*2)*h*.05);g.lineTo(w,h*(.3+i*.07));g.lineTo(0,h*(.3+i*.07));g.fill()})},
  glints:(g,w,h,r,s)=>{for(let i=0;i<s[1];i++){g.fillStyle='rgba('+s[2]+','+(.2+r()*.6)+')';g.fillRect(r()*w,r()*h*.8,2,2)}g.fillStyle='rgba(0,0,0,.35)';for(let i=0;i<14;i++){const x=r()*w;g.beginPath();g.moveTo(x,0);g.lineTo(x+20,r()*h*.35);g.lineTo(x+40,0);g.fill()}},
  stripes:(g,w,h,r,s)=>{s[1].forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,h*(.35+i*.045),w,h*.045)})}
};

/* ---------- the kit: palette + props + particles -> a whole themed scene ---------- */
function kit(name,spec){
  if(spec.tex)TEXFN[name]=trackKit(spec.tex);
  SKYFN[name]=pal=>skyBase(pal,(g,w,h,r)=>{for(const s of(spec.sky||[]))SKYX[s[0]](g,w,h,r,s)});
  THEMEFN[name]=function(pal){
    if(spec.ground!==false)ground(pal,spec.gdy==null?-34:spec.gdy,spec.gcol);
    if(spec.sun)disc(...spec.sun);
    const sandM=mc(spec.isle||'#e8d29a');
    for(const P of spec.props){
      scatter(P.n,P.seed,P.min||16,P.max||48,P.clear||10,(i,x,y,z,r,F)=>{
        const g=PR[P.k](r,i,P.o||{});
        let gy;
        if(P.fl)gy=F.y+(P.fy||6)+r()*(P.fr||18);
        else if(R.groundH){gy=R.groundH(x,z);if(P.isle){const rad=P.isle*(.8+r()*.5);const m=cyl(rad,rad*1.25,4.4,12,sandM,x,gy-1,z);world.add(m);gy+=1.2}}
        else gy=y-8;
        g.position.set(x,gy+(P.dy||0),z);g.rotation.y=P.face?face(x,z,F):r()*6.28;
        if(P.sc)g.scale.setScalar(P.sc*(.8+r()*.5));
        world.add(g);
        const an=g.userData.anim;if(an){const ph=r()*6;R.anim.push(t=>an(g,t+ph))}
        if(P.fl&&P.bob){const b0=gy,a0=r()*6;R.anim.push(t=>{g.position.y=b0+Math.sin(t*.7+a0)*P.bob})}
      });
    }
    for(const p of(spec.parts||[]))parts(...p);
    for(const f of(spec.fly||[]))flyers(...f);
    spec.extra&&spec.extra(pal);
  };
}

function updateKin(dt,init){
  for(const p of R.plats){
    const uc=p.amp*Math.sin(R.t*p.sp+p.ph);p.du=init?0:uc-p.uc;p.uc=uc;setWorldA(p.m,p.mid,uc,p.y);
  }
  for(const o of R.blocks){
    const cu=o.u+o.amp*Math.sin(R.t*o.sp+o.ph);o.vu=dt>0?(cu-o.cu)/dt:0;o.cu=cu;
    const cs=o.s+(o.ams||0)*Math.sin(R.t*(o.sps||1.6)+(o.sph||0));o.vs=dt>0&&o.cs!=null?(cs-o.cs)/dt:0;o.cs=cs;if(o.roll&&o.m.userData.ball&&dt>0)o.m.userData.ball.rotation.x-=o.vs*dt/o.m.userData.r;
    if(o.pop){const k=Math.sin(R.t*o.psp+o.pph);o.hh=k>0?o.h*Math.min(1,k*3):0;o.m.scale.y=Math.max(.001,o.hh/o.h)}else o.hh=o.h;
    setWorldA(o.m,cs,cu,o.y);if(o.m.userData.tick)o.m.userData.tick(R.t,o.vu,dt);
  }

    if(!init)w.ang+=w.w*dt;w.m.rotation.y=Math.PI/2-frame(w.s).t-w.ang;

}
function hitBox(o){
  const hh=o.hh==null?o.h:o.hh;if(hh<.2)return;

  if(d>=BR)return;
  if(d<1e-5){const pa=ha-Math.abs(da),pb=hb-Math.abs(db);if(pa<pb){na=Math.sign(da)||1;nb=0;d=-pa}else{na=0;nb=Math.sign(db)||1;d=-pb}}
  else{na/=d;nb/=d}

}
function hitSpin(w){
  if(P.y-BR>w.y+1.0||P.y+BR<w.y)return;
  for(let k=0;k<w.arms;k++){
    const th=w.ang+k*Math.PI*2/w.arms,ca=Math.cos(th),cb=Math.sin(th);
    const t=clamp((P.s-w.s)*ca+(P.u-w.u)*cb,0,w.len),qa=w.s+ca*t,qb=w.u+cb*t;
    let na=P.s-qa,nb=P.u-qb,d=Math.hypot(na,nb);const rad=BR+(t<.6?.4:.26);

    if(rel<0){const hk=PW.heavy>0?.3:1,e=rel<-.6?1.5:1;P.vs-=rel*na*hk*e;P.vu-=rel*nb*hk*e}
  }
}
function explode(b){
  const fy=b.y-.45-frameY(b.s);addFx(b.s,b.u,fy,0xff8a1a,BLAST,.5);addFx(b.s,b.u,fy,0xfff3b0,BLAST*.55,.3);
  world.remove(b.m);if(b.marker)world.remove(b.marker);b.dead=true;G.shake=.7;sfx('boom');
  const ds=P.s-b.s,du=P.u-b.u,dy=P.y-b.y,d=Math.hypot(ds,du,dy);
  if(d<BLAST&&PW.shield>0){popAt(ball.position.x,ball.position.y+1,ball.position.z,'Blocked!');G.shake=.25}
  else if(d<BLAST){
    const bk=(PW.heavy>0?.25:1)*(PERK==='tough'?.55:1);
    const f=(1-d/BLAST)*bk;let h=Math.hypot(ds,du),a=ds/h,c=du/h;
    if(h<.05){const r=rnd(0,6.28);a=Math.cos(r);c=Math.sin(r)}

  }

function spawnRain(){
  if(R.bombs.filter(b=>b.rain&&!b.dead).length>=6)return;
  const w=wAt(P.s+10),lim=Math.max(.5,w/2-.9);
  const s=P.s+rnd(6,14),u=clamp(P.u+rnd(-2.6,2.6),-lim,lim);

function popAt(wx,wy,wz,txt){

  if(v.z>1)return;
  const d=document.createElement('div');d.className='pop';d.textContent=txt;
  d.style.left=((v.x*.5+.5)*innerWidth)+'px';d.style.top=((-v.y*.5+.5)*innerHeight)+'px';
  $('#pops').appendChild(d);setTimeout(()=>d.remove(),900);
}

function step(dt){
  const dtw=PW.slow>0?dt*.45:dt;
  R.t+=dtw;G.t+=dt;
  updateKin(dtw);
  for(const t of R.tiles){
    if(t.state>=1)t.rt=(t.rt||0)+dt;
    if(t.gone){if(t.rt>5){t.gone=false;t.state=3;t.y=t.y0-4;t.fv=0;t.m.visible=true;setWorldA(t.m,t.mid,t.um,t.y)}else continue}
    if(t.state===1){t.tm+=dt;t.m.position.x+=(Math.random()-.5)*.03;if(t.tm>.55){t.state=2}}
    else if(t.state===2){t.fv+=30*dt;t.y-=t.fv*dt;setWorldA(t.m,t.mid,t.um,t.y);if(t.y<t.y0-7){t.gone=true;t.m.visible=false}}
    else if(t.state===3){t.y+=7*dt;if(t.y>=t.y0){t.y=t.y0;t.state=0;t.rt=0;t.tm=0;t.fv=0}setWorldA(t.m,t.mid,t.um,t.y)}
  }
  const playing=G.state==='play';
  if(playing){powerStep(dt);if(!R.def.bonus)RUN.time+=dt}

  // support
  const sf=surfaceAt(P.s,P.u,P.y);
  let grounded=false;
  if(sf&&P.y-BR<=sf.y+(P.grounded?.32:.06)&&P.vy<=0){
    if(!P.grounded&&P.vy<-5&&G.state==='play')sfx('land');
    P.y=sf.y+BR;P.vy=0;grounded=true;
    const r=sf.ref;if(!r&&playing&&P.s<R.L-6)R.safeS=P.s;
    if(r){if(r.crumble&&r.state===0&&playing){r.state=1;r.tm=0;sfx('crumble')}if(r.du)P.u+=r.du}
  }else if(G.state!=='dead')P.vy-=30*dt;
  P.grounded=grounded;
  const zk=(grounded&&R.def.zones&&R.def.zones.length)?R.def.zones.find(z=>P.s>z.a&&P.s<z.b):null;

  // control
  if(playing){
    // swipes push the ball; every swipe makes it a little faster, and the extra speed fades away slowly
    const pw=ctl.pw,bk=P.boost>0?Math.min(1,P.boost/.8):0,CF=MAXF*pw+6*bk,CB=MAXB*pw,CL=MAXL*pw;
    // speed builds up steadily while you keep rolling, and fades slowly when you stop
    if(P.vs>MAXF*pw*.55)ctl.pw=Math.min(1.5,ctl.pw+.03*dt);else if(!ctl.down)ctl.pw=Math.max(1,ctl.pw-.06*dt);
    // swipes go into a queue that is handed to the ball gradually (steady acceleration, no sudden jumps)
    if(ctl.ds||ctl.du){ctl.qs=clamp(ctl.qs+ctl.ds,-5,5);ctl.qu=clamp(ctl.qu+ctl.du,-5,5);ctl.ds=ctl.du=0}
    {const rs=clamp(ctl.qs,-ACC*dt,ACC*dt),ru=clamp(ctl.qu,-ACCU*dt,ACCU*dt);ctl.qs-=rs;ctl.qu-=ru;
      if(rs)P.vs=rs>0?Math.min(P.vs+rs,Math.max(P.vs,CF)):Math.max(P.vs+rs,Math.min(P.vs,-CB));
      if(ru)P.vu=ru>0?Math.min(P.vu+ru,Math.max(P.vu,CL)):Math.max(P.vu+ru,Math.min(P.vu,-CL));
      if(ctl.qs>0&&P.vs>=CF)ctl.qs=0;if(ctl.qs<0&&P.vs<=-CB)ctl.qs=0;if(ctl.qu>0&&P.vu>=CL)ctl.qu=0;if(ctl.qu<0&&P.vu<=-CL)ctl.qu=0}
    if(P.boost>0&&grounded&&P.vs<CF)P.vs=Math.min(CF,P.vs+9*dt);
    if(ctl.fx)P.vs=clamp(P.vs+ctl.fx*10*dt,Math.min(P.vs,-CB),Math.max(P.vs,CF));
    if(ctl.lx)P.vu=clamp(P.vu+ctl.lx*10*dt,Math.min(P.vu,-CL),Math.max(P.vu,CL));
    if(grounded){
      const f=2.6*dt*(zk&&zk.k==='slick'?(PERK==='grip'?.5:.07):1);P.vs-=clamp(P.vs,-f,f);P.vu-=clamp(P.vu,-f*1.1,f*1.1);
      if(zk&&zk.k==='mud'){const mk=PERK==='grip'?.35:1;P.vs*=Math.exp(-1.3*dt*mk);P.vu*=Math.exp(-1.8*dt*mk)}
      if(P.vs>CF+.5)P.vs*=Math.exp(-1.6*dt);if(P.vs<-CB-.5)P.vs*=Math.exp(-1.6*dt);
      if(Math.abs(P.vu)>CL+.5)P.vu*=Math.exp(-1.6*dt);
    }
  }else if(G.state==='won'||G.state==='portal'){
    const a=5*dt;P.vs+=clamp(0-P.vs,-a,a);P.vu+=clamp(0-P.vu,-a,a);
  }else if(G.state==='ready'||G.state==='menu'){P.vs=0;P.vu=0}

  const os=P.s,ou=P.u;

  if(zk&&zk.k==='belt'&&playing){const bk=PW.heavy>0?.3:1;P.s+=(zk.bs||0)*dt*bk;P.u+=(zk.bu||0)*dt*bk}

  }
  ball.position.set(F.x+F.rx*P.u,P.y,F.z+F.rz*P.u);

  if(under&&P.y-BR>=under.y-.3){blob.visible=true;blob.position.set(ball.position.x,under.y+.03,ball.position.z);const k=clamp(1.15-(P.y-BR-under.y)*.12,.4,1.15);blob.scale.set(k,k,k)}else blob.visible=false;

  // bombs
  if(playing){
    for(const r of R.def.rains)if(P.s>=r.a&&P.s<=r.b){R.rainT-=dtw;if(R.rainT<=0){R.rainT=r.every*rnd(.75,1.25);spawnRain()}}
  }
  const rm=b=>{b.dead=true;world.remove(b.m);if(b.marker){world.remove(b.marker);b.marker=null}};
  for(const b of R.bombs){
    if(b.dead)continue;

      const s2=surfaceAt(b.s,b.u,b.y);

  }
  R.bombs=R.bombs.filter(b=>!b.dead);

  // boost pads
  if(playing&&grounded)for(const o of R.boosts)if(Math.abs(P.s-o.s)<1.9&&Math.abs(P.u-o.u)<o.w/2+.3&&P.boost<1.4){P.boost=PERK==='boost'?3.4:2.3;sfx('boost')}

    }
  }
  if(playing&&grounded&&R.portals)for(const q of R.portals)if(Math.hypot(P.s-q.s,P.u-q.u)<1.5){G.state='portal';sfx('win');onPortal(q.k,q.s);break}

  for(const f of R.fx){f.t+=dt;const k=Math.min(1,f.t/f.dur);f.m.scale.setScalar(f.max*(.2+.8*Math.sqrt(k)));f.m.material.opacity=.85*(1-k);if(k>=1){f.dead=true;world.remove(f.m)}}

}

  });
}

let levelIdx=0,bonusK=null,resumeS=null,backS=null,snap=null;
function startLevel(i,bk,rs,sn){
  snap=sn||null;levelIdx=i;bonusK=bk==null?null:bk;resumeS=bonusK==null&&rs!=null?rs:null;const def=bonusK==null?LEVELS[i]:BONUS[bonusK];buildLevel(def);
  if(resumeS!=null)resumeAt(resumeS);
  if(snap&&bonusK==null)applySnap(snap);
  G.state='ready';G.shake=0;ctl.fx=ctl.lx=ctl.ds=ctl.du=ctl.qs=ctl.qu=0;ctl.pw=1;ctl.down=false;$('#stick').hidden=true;
  cam.s=P.s;cam.u=0;
  $('#lvnum').textContent=bonusK==null?i+1:'\u2605';
  $('#fade').classList.remove('on');
  hideAll();$('#start').hidden=false;updateHud();
  Music.duck(false);Music.play(def.mkey||def.pal.theme);
  const showC=!cardSkip&&resumeS==null&&!snap;cardSkip=false;
  if(showC)showCard(def,bonusK==null?i+1:null);
  else{hideCard();if(snap||resumeS!=null)sfx('respawn');toast(resumeS!=null?'Back on the main path. Keep rolling!':def.blurb+(def.portals&&def.portals.length?' A portal is hidden somewhere here!':''),3800)}
}
onCheckpoint=c=>{
  snap={s:c.s,pts:R.pts,sec:!!(R.secret&&R.secret.got),cnt:R.coinCount,got:R.coins.map((k,i)=>k.got?i:-1).filter(i=>i>=0)};
  markCp(c);toast('Checkpoint!',1400);
};
function markCp(c){c.hit=true;if(c.flagMat)c.flagMat.color.set('#35e06a');if(c.lamp)c.lamp.material.color.set('#35e06a')}
function applySnap(sn){
  for(const c of R.cps)if(c.s<=sn.s+.1)markCp(c);
  for(const c of R.coins)if(c.s<sn.s-1){c.got=true;c.m.visible=false}
  for(const i of sn.got){const c=R.coins[i];if(c){c.got=true;c.m.visible=false}}
  if(R.secret&&sn.sec){R.secret.got=true;R.secret.m.visible=false}
  R.pts=sn.pts;R.coinCount=sn.cnt;G.onCoin&&G.onCoin();
  P.s=sn.s;P.u=0;P.vs=P.vu=P.vy=0;P.y=frameY(sn.s)+BR;P.grounded=true;
}
function resumeAt(s){
  // back from a bonus world: stand on the main track where the portal was, with the earlier coins gone and the portal used up
  let gone=0;for(const c of R.coins)if(c.s<s+1){c.got=true;c.m.visible=false;gone++}
  R.total-=gone;if(R.secret&&R.secret.s<s+1){R.secret.got=true;R.secret.m.visible=false}R.portals=[];if(R.portalMeshes)for(const m of R.portalMeshes)m.visible=false;
  P.s=s;P.u=0;P.vs=P.vu=P.vy=0;P.y=frameY(s)+BR;P.grounded=true;
}
function goMenu(name){
  G.state='menu';buildLevel(LEVELS[0]);for(const p of R.pups||[])p.m.visible=false;if(R.secret){R.secret.got=true;R.secret.m.visible=false}cam.s=P.s;cam.u=0;
  $('#start').hidden=true;hideCard();Music.duck(false);Music.play('menu');
  if(name==='levels')renderLevels();
  if(name==='shop')renderShop();
  $('#m-bank').textContent=save.bank;renderPill();show(name||'menu');
}
onWin=()=>{
  const isB=bonusK!=null,full=R.coinCount===R.total,val=1,bonus=full?10:0,got=R.coinCount;
  save.bank+=R.pts+bonus;
  const bk=isB?'b'+bonusK:levelIdx;save.best[bk]=Math.max(save.best[bk]||0,got+(isB?0:RUN.cBase));
  let goals=null,stars=0,newSk=[];
  if(!isB){goals=starGoals(R.def);stars=Math.max(1,goals.filter(g=>g.ok).length);const old=save.stars[levelIdx]||0;if(stars>old)save.stars[levelIdx]=stars;newSk=grantStarSkins()}
  if(!isB)save.unlocked=Math.min(LEVELS.length,Math.max(save.unlocked,levelIdx+2));
  persist();updateHud();Music.stop(1.4);
  const last=!isB&&levelIdx>=LEVELS.length-1;
  setTimeout(()=>{
    $('#r-title').textContent=last?'All levels done!':isB?'Bonus complete!':'Level clear!';
    $('#r-stats').innerHTML=(goals?'<div class="rstars">'+[0,1,2].map(i=>'<i class="'+(i<stars?'on':'')+'" style="--d:'+(i*.25)+'s">\u2605</i>').join('')+'</div>'+goals.map(g=>'<div class="goal '+(g.ok?'ok':'no')+'"><span>'+(g.ok?'\u2714 ':'\u2718 ')+g.t+'</span><span>'+g.v+'</span></div>').join('')+(newSk.length?'<div class="unl">New ball unlocked: '+newSk.map(s=>s.name).join(', ')+'!</div>':''):'')+
      (R.secret&&R.secret.got?'<div class="goal ok"><span>\u2605 Secret coin found!</span><span>+10</span></div>':'')+
      '<div><span>Coins collected</span><span>'+(got+(isB?0:RUN.cBase))+' / '+(isB?R.total:R.def.coins.length)+'</span></div>'+
      '<div><span>Points</span><span>'+R.pts+'</span></div>'+
      '<div><span>All-coins bonus</span><span>'+(full?'+'+bonus:'none')+'</span></div>'+
      '<div><span>Bank</span><span>'+save.bank+'</span></div>';
    $('#b-next').hidden=last;$('#b-next').textContent=isB?'Back to the level':'Next level';
    show('result');$('#hud').hidden=false;
  },1000);
};
onPortal=(k,ps)=>{backS=ps;
  save.bank+=R.pts;RUN.cBase+=R.coinCount;persist();updateHud();toast('Portal! Bonus level!',1200);
  setTimeout(()=>$('#fade').classList.add('on'),500);
  setTimeout(()=>startLevel(levelIdx,k),950);
};
onDie=()=>{
  const lost=R.coinCount;Music.duck(true);RUN.deaths++;
  if(PERK==='heart'&&!RUN.heart&&bonusK==null){const hs=heartSnap();if(hs){RUN.heart=true;snap=hs}}
  const hsnap=snap&&snap.heart;
  toast(hsnap?'Second chance! Back to a safe spot.':snap?'You fell off. Back to the checkpoint!':(lost?'You fell off and lost '+R.pts+' points.':'You fell off the edge.'),1500);
  setTimeout(()=>{$('#fade').classList.add('on')},700);
  setTimeout(()=>{cardSkip=true;if(G.state==='dead')startLevel(levelIdx,bonusK,resumeS,snap)},1100);
};

/* ---------- swipe controls ---------- */
const keys={};
function beginPlay(){if(cardOpen)return;if(G.state==='ready'){G.state='play';$('#start').hidden=true;sfx('go');if(PERK==='start')P.boost=2.4}}
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS'].includes(e.code)){beginPlay();if(e.code.startsWith('Arrow'))e.preventDefault()}
  if((e.code==='Escape'||e.code==='KeyP')&&(G.state==='play'||G.state==='ready'||G.state==='paused'))togglePause();
});
addEventListener('keyup',e=>{keys[e.code]=false});
const GU=.04,GF=.045,GB=.04;
const ring=$('#stick');
function placeRing(x,y){ring.style.left=x+'px';ring.style.top=y+'px'}
canvas.addEventListener('pointerdown',e=>{
  if(cardOpen||(G.state!=='play'&&G.state!=='ready'))return;
  beginPlay();ctl.down=true;ctl.id=e.pointerId;ctl.lastX=e.clientX;ctl.lastY=e.clientY;ctl.pw=Math.min(1.5,ctl.pw+.03);
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  placeRing(e.clientX,e.clientY);ring.hidden=false;
});
canvas.addEventListener('pointermove',e=>{
  if(!ctl.down||e.pointerId!==ctl.id)return;
  const dx=e.clientX-ctl.lastX,dy=e.clientY-ctl.lastY;ctl.lastX=e.clientX;ctl.lastY=e.clientY;
  ctl.sw=(ctl.sw||0)+Math.hypot(dx,dy);if(ctl.sw>45){ctl.sw=0;sfx('swipe')}
  ctl.du+=dx*GU;ctl.ds+=-dy*(dy<0?GF:GB);
  placeRing(e.clientX,e.clientY);
});
const endTouch=e=>{if(e.pointerId!==ctl.id)return;ctl.down=false;ring.hidden=true};
canvas.addEventListener('pointerup',endTouch);canvas.addEventListener('pointercancel',endTouch);
function readInput(){
  const l=keys.ArrowLeft||keys.KeyA,r=keys.ArrowRight||keys.KeyD,u=keys.ArrowUp||keys.KeyW,d=keys.ArrowDown||keys.KeyS;
  ctl.lx=(r?1:0)-(l?1:0);ctl.fx=(u?1:0)-(d?1:0);
}
let pausedFrom='play';
function togglePause(){
  if(G.state==='play'||G.state==='ready'){pausedFrom=G.state;G.state='paused';ctl.down=false;ctl.fx=ctl.lx=ctl.ds=ctl.du=0;ring.hidden=true;show('pause');Music.duck(true);sfx('pause');$('#hud').hidden=false;$('#start').hidden=true}
  else if(G.state==='paused'){G.state=pausedFrom;hideAll();Music.duck(false);sfx('unpause');$('#start').hidden=G.state!=='ready'}
}

/* ---------- camera and loop ---------- */
const cam={s:6,u:0};
function updateCamera(dt){
  if(window.__FC){camera.position.set(...window.__FC.p);camera.lookAt(...window.__FC.l);camera.fov=window.__FC.f||55;camera.updateProjectionMatrix();return}
  const ks=1-Math.exp(-9*dt),ku=1-Math.exp(-6*dt);
  cam.s+=(P.s-cam.s)*ks;
  cam.u+=((G.state==='menu'?Math.sin(G.t*.6)*.8:P.u*.9)-cam.u)*ku;
  const back=frame(cam.s-5.6),ahead=frame(cam.s+7);
  const trackY=frameY(P.s),drop=clamp(P.y-BR-trackY,-6,0),cy=back.y+2.9+drop*.45;
  const sh=G.shake;
  camera.position.set(back.x+back.rx*cam.u+(Math.random()-.5)*sh,cy+(Math.random()-.5)*sh,back.z+back.rz*cam.u);
  camera.lookAt(ahead.x+ahead.rx*cam.u*.55,ahead.y+.5+drop*.3,ahead.z+ahead.rz*cam.u*.55);
  const boostK=P.boost>0?1:0;G.fov+=(boostK*9-G.fov)*(1-Math.exp(-5*dt));
  camera.fov=baseFov+G.fov;camera.updateProjectionMatrix();
}
const STEP=1/120;let last=performance.now(),acc=0;
const fill=$('#fill'),prog=$('#prog'),spd=$('#spd');
function frameLoop(now){
  requestAnimationFrame(frameLoop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.state!=='paused'){
    readInput();acc+=dt;
    let n=0;while(acc>=STEP&&n++<12){step(STEP);acc-=STEP}
  }
  if(G.state==='menu')ball.rotation.y+=dt*.6;
  for(const c of R.coins){
    if(c.got){if(c.pop>0){c.pop+=dt;const k=c.pop/.25;c.m.scale.setScalar(1+k*.8);c.m.position.y+=dt*3;if(k>=1){c.pop=-1;c.m.visible=false}}continue}
    c.m.rotation.y=now/280+c.s;
  }
  for(const b of R.boosts)b.mat.map.offset.y=-(now/1000*1.6)%1;
  if(R.anim)for(const f of R.anim)f(now/1000,dt);
  const p=clamp((P.s-R.start)/(R.L-R.start),0,1);
  fill.style.width=(p*100)+'%';prog.style.setProperty('--p',p);
  const sp=Math.round(ctl.pw*100)/100;spd.textContent=sp>1.01?'Speed x'+sp.toFixed(2):'';
  updateLight(now/1000,dt);ballFx(dt,now/1000);pwFrame(dt,now/1000);rollSound(Math.hypot(P.vs,P.vu),G.state==='play'&&P.grounded);
  updateCamera(dt);skyRig.position.copy(camera.position);qualityTick(dt);renderer.render(scene,camera);
}

/* ---------- wiring ---------- */
$('#b-play').addEventListener('click',()=>{sfx('tick');renderLevels();show('levels')});
$('#b-shop').addEventListener('click',()=>{sfx('tick');renderShop();show('shop')});
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>goMenu(b.dataset.go)));
function refreshTg(){document.querySelectorAll('[data-tg]').forEach(b=>{const k=b.dataset.tg;b.textContent=(k==='sound'?'Sound: ':k==='haptic'?'Vibration: ':'Music: ')+(save[k]===false?'off':'on')})}
document.querySelectorAll('[data-tg]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.tg,on=save[k]===false;save[k]=on;persist();ac();if(k==='sound'&&SB)SB.gain.value=on?1.8:0;if(k==='music'&&MB)MB.gain.setTargetAtTime(on?.42:0,AC.currentTime,.05);refreshTg();if(on&&k==='sound')sfx('tick');if(on&&k==='haptic')haptic('check')}));refreshTg();
$('#pause').addEventListener('click',togglePause);
$('#b-resume').addEventListener('click',togglePause);
$('#b-restart').addEventListener('click',()=>{cardSkip=true;if(bonusK==null&&resumeS==null)resetRun();startLevel(levelIdx,bonusK,resumeS)});
$('#b-quit').addEventListener('click',()=>goMenu('levels'));
$('#b-next').addEventListener('click',()=>{if(bonusK!=null)startLevel(levelIdx,null,backS);else{resetRun();startLevel(levelIdx+1)}});
$('#b-again').addEventListener('click',()=>{if(bonusK==null&&resumeS==null)resetRun();startLevel(levelIdx,bonusK,resumeS)});
$('#b-menu').addEventListener('click',()=>goMenu('levels'));

if(window.__ER_DEBUG)window.__ER={renderLevels,placeSecret,PW,RUN,save,onWinX:()=>onWin(),setPerk,SKINS,G,P,ctl,LEVELS,BONUS,startLevel,goMenu,Music,sfx,MUS,SFX,showCard,hideCard,paintCard,get AC(){return AC},world,SKINS,applySkin,get R(){return R},get PATH(){return PATH},frame,frameY,wAt,step,surfaceAt,inRail,inHole,MAXF,MAXL};
applySkin(save.ball);
goMenu('menu');
requestAnimationFrame(frameLoop);
})();
</script>
